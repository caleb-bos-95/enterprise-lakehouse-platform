# =============================================================================
# Enterprise Lakehouse Platform — CI Pipeline
# =============================================================================
# Runs on: push to main/develop, pull requests targeting main
#
# Stages:
#   1. lint         Python (ruff), SQL (sqlfluff), YAML (yamllint)
#   2. test         Python unit tests (pytest)
#   3. dbt-validate dbt parse + compile (no warehouse connection required)
#   4. docker-check docker compose config validation
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ---------------------------------------------------------------------------
  # Lint — Python, SQL, YAML
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install ruff sqlfluff yamllint

      - name: Lint Python (ruff)
        run: ruff check . --select E,W,F,I
        continue-on-error: false

      - name: Lint YAML (yamllint)
        run: |
          yamllint -d relaxed docker-compose.yml docker-compose.airflow.yml \
            docker-compose.spark.yml docker-compose.trino.yml docker-compose.governance.yml \
            .github/workflows/ci.yml

      - name: Lint SQL (sqlfluff)
        run: |
          if find dbt/models -name "*.sql" | grep -q .; then
            sqlfluff lint dbt/models --dialect trino --processes 4
          else
            echo "No SQL models found — skipping."
          fi

  # ---------------------------------------------------------------------------
  # Unit Tests — Python
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run unit tests
        run: |
          if find tests/unit -name "test_*.py" | grep -q .; then
            pytest tests/unit -v --tb=short --cov=spark --cov=airflow \
              --cov-report=term-missing --cov-fail-under=50
          else
            echo "No unit tests found — skipping."
          fi

  # ---------------------------------------------------------------------------
  # dbt Validate — parse and compile models without a live warehouse
  # ---------------------------------------------------------------------------
  dbt-validate:
    name: dbt Validate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt
        run: pip install dbt-trino dbt-core

      - name: dbt parse
        working-directory: dbt
        run: |
          if [ -f dbt_project.yml ]; then
            dbt parse --profiles-dir . --target ci
          else
            echo "No dbt_project.yml found — skipping."
          fi

  # ---------------------------------------------------------------------------
  # Docker — validate compose file syntax
  # ---------------------------------------------------------------------------
  docker-check:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy env file
        run: cp .env.example .env

      - name: Validate core compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Airflow compose
        run: docker compose -f docker-compose.yml -f docker-compose.airflow.yml config --quiet

      - name: Validate Spark compose
        run: docker compose -f docker-compose.yml -f docker-compose.spark.yml config --quiet

      - name: Validate Trino compose
        run: docker compose -f docker-compose.yml -f docker-compose.trino.yml config --quiet

      - name: Validate Governance compose
        run: docker compose -f docker-compose.yml -f docker-compose.governance.yml config --quiet
