# =============================================================================
# Trino — Iceberg Catalog (backed by MinIO)
# =============================================================================
# Queries:
#   SHOW SCHEMAS FROM iceberg;
#   SHOW TABLES FROM iceberg.bronze;
#   SELECT * FROM iceberg.gold.dim_customers LIMIT 100;
# =============================================================================

connector.name=iceberg
iceberg.catalog.type=hadoop
hive.metastore.uri=thrift://localhost:9083

# MinIO / S3A endpoint
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=admin
hive.s3.aws-secret-key=password123
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false

# Iceberg storage root
iceberg.catalog.warehouse=s3a://bronze/
