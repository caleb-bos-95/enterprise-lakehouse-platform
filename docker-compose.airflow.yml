# =============================================================================
# Enterprise Lakehouse Platform — Airflow Orchestration Stack
# =============================================================================
# Depends on: docker-compose.yml (postgres, lakehouse-net)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.airflow.yml up -d
#
# Or via Makefile:
#   make up-airflow
#
# UI: http://localhost:8085  (admin / admin by default)
# =============================================================================

version: "3.9"

networks:
  lakehouse-net:
    external: true

volumes:
  airflow_logs:

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.11
  restart: unless-stopped
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # Connections — injected via env so no manual UI setup required
    AIRFLOW_CONN_MINIO_DEFAULT: "s3://admin:password123@?host=http://minio:9000&aws_access_key_id=${MINIO_ROOT_USER:-admin}&aws_secret_access_key=${MINIO_ROOT_PASSWORD:-password123}"
    AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
  networks:
    - lakehouse-net
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ---------------------------------------------------------------------------
  # Airflow DB Init — runs once to migrate schema and create admin user
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: lakehouse-airflow-init
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER:-admin} \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@lakehouse.local || true
        echo "Airflow initialisation complete."

  # ---------------------------------------------------------------------------
  # Airflow Webserver
  # UI: http://localhost:8085
  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: lakehouse-airflow-webserver
    ports:
      - "8085:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Airflow Scheduler
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: lakehouse-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
