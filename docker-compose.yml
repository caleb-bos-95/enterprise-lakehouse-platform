# =============================================================================
# Enterprise Lakehouse Platform — Core Infrastructure
# =============================================================================
# Services: MinIO (object storage), Redpanda (event streaming), PostgreSQL
#
# Usage:
#   docker compose up -d
#
# See Makefile for convenience targets:
#   make up-all        Start all service stacks
#   make up-core       Start core infrastructure only
#   make down          Stop all services
# =============================================================================

version: "3.9"

networks:
  lakehouse-net:
    name: lakehouse-net
    driver: bridge

volumes:
  minio_data:
  redpanda_data:
  postgres_data:

services:

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (Bronze / Silver / Gold buckets)
  # UI: http://localhost:9001
  # API: http://localhost:9000
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-01T00-00-00Z
    container_name: lakehouse-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # MinIO bucket initialisation — creates bronze / silver / gold on first run
  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-password123};
        mc mb --ignore-existing local/bronze;
        mc mb --ignore-existing local/silver;
        mc mb --ignore-existing local/gold;
        mc mb --ignore-existing local/checkpoints;
        echo 'Buckets initialised.';
      "

  # ---------------------------------------------------------------------------
  # Redpanda — Kafka-compatible event streaming (no Zookeeper required)
  # Kafka API:  localhost:19092
  # Schema Reg: localhost:18081
  # Admin API:  localhost:9644
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: lakehouse-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=info
    ports:
      - "18081:18081"   # Schema Registry
      - "18082:18082"   # Pandaproxy REST
      - "19092:19092"   # Kafka API (external)
      - "9644:9644"     # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redpanda Console — Topic browser and consumer group UI
  # UI: http://localhost:8080
  # ---------------------------------------------------------------------------
  redpanda-console:
    image: redpandadata/console:v2.4.5
    container_name: lakehouse-redpanda-console
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    volumes:
      - ./configs/redpanda/console-config.yml:/tmp/config.yml:ro
    networks:
      - lakehouse-net
    depends_on:
      redpanda:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # PostgreSQL — Relational backend for Airflow metadata
  # Port: 5432
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: lakehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
